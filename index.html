<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Providus</title>
<meta name="theme-color" content="#1f2030">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:light;--bg:#f8f8fa;--card:#fff;--ink:#1f2030;--mute:#6b6b82;--line:#e4e4ec;--accent:#4a55e0;--chip:#f1f1f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.main{flex:1;overflow-y:auto;padding:24px}
.row{display:flex;justify-content:space-between;align-items:center}
.hello{font-size:26px;white-space:nowrap}
.hello span{font-weight:400}
.hello b{font-weight:500}
.sq{width:46px;height:46px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sq.g{background:var(--chip);width:44px;height:44px}
.flag{width:40px;height:40px;display:block}
.card{background:var(--card);border-radius:18px;padding:22px;margin-bottom:22px}
.lab{color:var(--mute);font-size:18px;display:flex;align-items:center;gap:10px}
.bal{font-size:44px;font-weight:700;margin:14px 0 18px;letter-spacing:-.5px}
.acc{display:flex;align-items:center;gap:6px;font-size:19px;font-weight:500;margin-bottom:20px}
.btn{background:var(--ink);color:#fff;border-radius:14px;height:58px;font-size:20px;font-weight:600;width:100%;text-align:center}
.sug{color:var(--mute);font-size:19px;margin-bottom:12px}
.tiles{display:flex;gap:12px;margin-bottom:22px}
.tile{flex:1;height:100px;border-radius:16px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:14px;font-size:17px;background:linear-gradient(160deg,#3a3b45,#14151c)}
.tile.b{background:linear-gradient(160deg,#5560ea,#2c35a8)}
.tile svg{width:30px;height:30px}
.rt{display:flex;justify-content:space-between;font-size:20px;margin-bottom:12px}
.rt .va{color:var(--accent);font-weight:500}
.day{color:var(--mute);font-size:17px}
.tx{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);width:100%}
.tx:last-child{border:0}
.av{width:52px;height:52px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;color:#8a8aa0;font-size:19px;position:relative;flex:none}
.av i{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:#fde8ec;color:#d0103a;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
.av i svg{width:11px;height:11px;stroke-width:3}
.tx b{display:block;font-size:20px;font-weight:500}.tx small{color:var(--mute);font-size:17px}
.tx .amt{margin-left:auto;font-size:20px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--mute)}
nav button.a{color:var(--ink);font-weight:700}
nav button.a svg{fill:currentColor}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:28px;z-index:9}
#pop.on{display:flex}
.alert{background:#000;border-radius:18px;padding:28px 24px;text-align:center;max-width:380px;width:100%}
.alert h3{color:#ff2d2d;font-size:24px;margin:0 0 10px}
.alert p{color:#ff2d2d;font-size:19px;margin:0 0 22px}
.alert button{background:#ff2d2d;color:#000;border-radius:12px;height:50px;width:100%;font-size:18px;font-weight:700;text-align:center}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="list" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h.01M8 12h.01M8 16h.01M12 8h5M12 12h5M12 16h5"/></symbol>
  <symbol id="send" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></symbol>
  <symbol id="wallet" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="13" r="1.6"/></symbol>
  <symbol id="menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="eyeoff" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></symbol>
  <symbol id="expand" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></symbol>
  <symbol id="right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></symbol>
  <symbol id="card" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></symbol>
  <symbol id="pos" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><rect x="8.5" y="4.5" width="7" height="3.5" rx=".8"/><path d="M9 12h.01M12 12h.01M15 12h.01M9 15.5h.01M12 15.5h.01M15 15.5h.01M9 19h.01M12 19h.01M15 19h.01"/></symbol>
  <symbol id="out" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></symbol>
</svg>

<div class="app">
  <div class="main">
    <div class="row" style="margin-top:10px">
      <div class="row" style="gap:12px">
        <div class="hello"><span>Hello,</span> <b>Great Adeleye</b></div>
        <button class="sq" data-w aria-label="Switch account"><svg class="i"><use href="#down"/></svg></button>
      </div>
      <button data-w aria-label="Country"><svg class="flag" viewBox="0 0 40 40"><defs><clipPath id="c"><circle cx="20" cy="20" r="20"/></clipPath></defs><g clip-path="url(#c)"><rect width="14" height="40" fill="#008751"/><rect x="13.3" width="13.4" height="40" fill="#fff"/><rect x="26.6" width="13.4" height="40" fill="#008751"/></g></svg></button>
    </div>

    <div class="card" style="margin-top:22px">
      <div class="row">
        <div class="lab">Total Balance <button class="sq g" id="eye" aria-label="Show or hide balance"><svg class="i"><use id="eyeU" href="#eye"/></svg></button></div>
        <button class="sq g" data-w aria-label="Expand"><svg class="i"><use href="#expand"/></svg></button>
      </div>
      <div class="bal" id="bal">₦7,050,000.00</div>
      <button class="acc" data-w>My Accounts <svg class="i" style="width:20px;height:20px"><use href="#right"/></svg></button>
      <button class="btn" data-w>Make Transfer</button>
    </div>

    <div class="sug">Suggested for you</div>
    <div class="tiles">
      <button class="tile" data-w><svg class="i"><use href="#plus"/></svg>Add Money</button>
      <button class="tile b" data-w><svg class="i"><use href="#card"/></svg>Cards</button>
      <button class="tile" data-w><svg class="i"><use href="#pos"/></svg>Terminals</button>
    </div>

    <div class="card" style="padding:18px 22px">
      <div class="rt"><span style="font-weight:500">Recent Transactions</span><button class="va" data-w>View all</button></div>
      <div class="day">05 Nov 2026</div>
      <button class="tx" data-w><div class="av">NK<i><svg class="i"><use href="#out"/></svg></i></div><div><b>Nwabunwa…</b><small>5:55 PM</small></div><div class="amt">−₦100,000.00</div></button>
      <button class="tx" data-w><div class="av">BG<i><svg class="i"><use href="#out"/></svg></i></div><div><b>Bidemi Gben…</b><small>8:42 AM</small></div><div class="amt">−₦150,000.00</div></button>
    </div>
  </div>
  <nav>
    <button class="a" data-w><svg class="i"><use href="#home"/></svg>Dashboard</button>
    <button data-w><svg class="i"><use href="#list"/></svg>Transactions</button>
    <button data-w><svg class="i"><use href="#send"/></svg>Transfer</button>
    <button data-w><svg class="i"><use href="#wallet"/></svg>Payments</button>
    <button data-w><svg class="i"><use href="#menu"/></svg>More</button>
  </nav>
</div>

<div id="pop"><div class="alert"><h3>⚠ WARNING</h3><p>This account is restricted.</p><button id="ok">OK</button></div></div>

<script>
var pop=document.getElementById('pop'),hidden=false;
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.closest('#ok')){pop.classList.remove('on');return}
  if(t.closest('#pop')) return;
  if(t.closest('#eye')){
    hidden=!hidden;
    document.getElementById('bal').textContent=hidden?'₦ ••••••':'₦7,050,000.00';
    document.getElementById('eyeU').setAttribute('href',hidden?'#eyeoff':'#eye');
    return;
  }
  if(t.closest('[data-w]')) pop.classList.add('on');
});
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
</html>
